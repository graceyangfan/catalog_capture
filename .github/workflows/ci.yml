name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with rust-toolchain.toml / workspace.package.rust-version
  RUSTUP_TOOLCHAIN: 1.99.1
  # Immutable project fork baseline, shared with bootstrap-deps.sh.
  NAUTILUS_TRADER_REPOSITORY: graceyangfan/nautilus_trader
  NAUTILUS_TRADER_REF: 0efbce914a07933e976317e83bb6b0c8f3391147

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog capture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: catalog_capture

      - name: Checkout nautilus_trader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.NAUTILUS_TRADER_REPOSITORY }}
          ref: ${{ env.NAUTILUS_TRADER_REF }}
          path: nautilus_trader_quantity_commission
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: catalog_capture
          shared-key: native-${{ env.NAUTILUS_TRADER_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline validation tools
        run: pip install pre-commit predict-sdk==0.0.22 requests websocket-client websockets python-dotenv

      - name: Verify Predict Python controls
        working-directory: catalog_capture
        run: python -m unittest discover -s tests -p 'test_predict*.py'

      - name: Verify Predict evidence
        working-directory: catalog_capture
        run: python3 tests/predict_evidence.py

      - name: Run pre-commit
        working-directory: catalog_capture
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout catalog capture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: catalog_capture

      - name: Checkout nautilus_trader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.NAUTILUS_TRADER_REPOSITORY }}
          ref: ${{ env.NAUTILUS_TRADER_REF }}
          path: nautilus_trader_quantity_commission
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: catalog_capture
          shared-key: native-${{ env.NAUTILUS_TRADER_REF }}

      # Default features = all-venues (operator-friendly full CLI).
      - name: Run unit tests (default features)
        working-directory: catalog_capture
        run: cargo test --workspace --lib --bins --locked

      - name: Run Lighter extension offline integration tests
        working-directory: catalog_capture
        run: cargo test -p nautilus-lighter-ext --locked

      - name: Check slim Lighter binary CLI
        working-directory: catalog_capture
        run: cargo check -p catalog-capture-cli --no-default-features --features venue-lighter-ext --locked

      - name: Run Predict adapter tests
        working-directory: catalog_capture
        run: cargo test -p nautilus-predict --lib --tests --locked -- --test-threads=1

      - name: Verify Predict private execution offline
        working-directory: catalog_capture
        run: |
          cargo test -p nautilus-predict --features execution --lib --tests --locked -- --test-threads=1
          cargo clippy -p nautilus-predict --features execution --all-targets --locked -- -D warnings
          cargo check -p nautilus-predict --lib --no-default-features --features execution --locked

      - name: Build Predict API documentation
        working-directory: catalog_capture
        run: cargo doc -p nautilus-predict --no-deps --features execution --locked

      - name: Check Predict domain without live runtime
        working-directory: catalog_capture
        run: cargo check -p nautilus-predict --lib --no-default-features --locked

      # Slim CLI graph smoke: deribit-only product binary still compiles.
      - name: Check slim venue-deribit CLI
        working-directory: catalog_capture
        run: cargo check -p catalog-capture-cli --no-default-features --features venue-deribit --locked

  cargo-deny:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout catalog capture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: catalog_capture

      - name: Checkout nautilus_trader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.NAUTILUS_TRADER_REPOSITORY }}
          ref: ${{ env.NAUTILUS_TRADER_REF }}
          path: nautilus_trader_quantity_commission
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked

      - name: Check licenses
        working-directory: catalog_capture
        run: cargo deny check licenses
