name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with rust-toolchain.toml / workspace.package.rust-version
  RUSTUP_TOOLCHAIN: 1.99.0
  # Pin sibling nautilus_trader revision (do not track develop tip).
  # Local checkout used for current adapters: 587e1065efde08db19016a8eab921c1605d5d2a4
  NAUTILUS_TRADER_REF: 587e1065efde08db19016a8eab921c1605d5d2a4

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog capture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: catalog_capture

      - name: Checkout nautilus_trader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: graceyangfan/nautilus_trader
          ref: ${{ env.NAUTILUS_TRADER_REF }}
          path: nautilus_trader_quantity_commission
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        working-directory: catalog_capture
        run: pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout catalog capture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: catalog_capture

      - name: Checkout nautilus_trader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: graceyangfan/nautilus_trader
          ref: ${{ env.NAUTILUS_TRADER_REF }}
          path: nautilus_trader_quantity_commission
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: catalog_capture

      # Default features = all-venues (operator-friendly full CLI).
      - name: Run unit tests (default features)
        working-directory: catalog_capture
        run: cargo test --workspace --lib --bins

      - name: Run Predict adapter tests
        working-directory: catalog_capture
        run: cargo test -p nautilus-predict --lib --tests --locked

      - name: Verify Predict private execution offline
        working-directory: catalog_capture
        run: |
          cargo test -p nautilus-predict --features execution --lib --tests --locked
          cargo clippy -p nautilus-predict --features execution --all-targets --locked -- -D warnings
          cargo check -p nautilus-predict --lib --no-default-features --features execution --locked

      - name: Verify Predict quantity-commission baseline offline
        working-directory: catalog_capture
        run: cargo test -p nautilus-predict --features native-quantity-commission --lib --tests --locked

      - name: Check Predict domain without live runtime
        working-directory: catalog_capture
        run: cargo check -p nautilus-predict --lib --no-default-features --locked

      # Slim CLI graph smoke: deribit-only product binary still compiles.
      - name: Check slim venue-deribit CLI
        working-directory: catalog_capture
        run: cargo check -p catalog-capture-cli --no-default-features --features venue-deribit

      - name: Run clippy
        working-directory: catalog_capture
        run: cargo clippy -p nautilus-predict -p catalog-capture-core -p catalog-capture-runtime-adapter -p catalog-capture-cli --all-targets -- -D warnings

  cargo-deny:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - name: Checkout catalog capture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: catalog_capture

      - name: Checkout nautilus_trader
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: graceyangfan/nautilus_trader
          ref: ${{ env.NAUTILUS_TRADER_REF }}
          path: nautilus_trader_quantity_commission
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.9 --locked

      - name: Check licenses
        working-directory: catalog_capture
        run: cargo deny check licenses
