[workspace]
default-members = ["crates/catalog-capture-cli"]
members = [
  "crates/catalog-capture-core",
  "crates/catalog-capture-runtime-adapter",
  "crates/catalog-capture-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97.1"
version = "0.1.0"
authors = ["yfclark", "Codex"]
license = "LGPL-3.0-or-later"
readme = "README.md"
description = "Independent market-data capture writing Nautilus Trader Rust ParquetDataCatalog layouts"
repository = "https://github.com/graceyangfan/nautilus_catalog_capture"
publish = false

[workspace.metadata.tools]
cargo-deny = "0.19.9"

[workspace.dependencies]
ahash = "0.8"
anyhow = "1"
chrono = "0.4"
chrono-tz = "0.10.4"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
log = "0.4"
parquet = "58.3.0"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
  "net",
  "io-util",
] }
toml = "0.8"
ustr = "1.1.0"
nautilus-binance = { path = "../nautilus_trader/crates/adapters/binance" }
nautilus-bybit = { path = "../nautilus_trader/crates/adapters/bybit" }
nautilus-deribit = { path = "../nautilus_trader/crates/adapters/deribit", features = [
  "arrow",
] }
nautilus-okx = { path = "../nautilus_trader/crates/adapters/okx" }
nautilus-common = { path = "../nautilus_trader/crates/common" }
nautilus-core = { path = "../nautilus_trader/crates/core" }
# Capture path does not need Hyperliquid Python bindings (keeps the graph lighter).
nautilus-hyperliquid = { path = "../nautilus_trader/crates/adapters/hyperliquid", features = [
  "arrow",
] }
nautilus-live = { path = "../nautilus_trader/crates/live", default-features = false, features = [
  "node",
] }
nautilus-model = { path = "../nautilus_trader/crates/model" }
nautilus-persistence = { path = "../nautilus_trader/crates/persistence" }
nautilus-serialization = { path = "../nautilus_trader/crates/serialization", features = [
  "arrow",
] }

[patch.crates-io]
# PyO3 0.29 requires the patched pyo3-stub-gen crate from the sibling dependency tree.
pyo3-stub-gen = { path = "../nautilus_trader/patches/pyo3-stub-gen" }

# -----------------------------------------------------------------------------
# Profiles (aligned with nautilus_trader: one product binary, lean dev artifacts)
# -----------------------------------------------------------------------------
[profile.dev]
opt-level = 0
debug = false
strip = "debuginfo"
lto = false
incremental = true

# Third-party crates recompile rarely; slight optimization speeds test/run loops.
[profile.dev.package."*"]
opt-level = 1

[profile.test]
opt-level = 0
debug = true
incremental = true

[profile.test.package."*"]
opt-level = 1

[profile.ci]
inherits = "dev"
incremental = false

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 16
