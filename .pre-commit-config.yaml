# Pre-commit config aligned with Nautilus Trader practices (subset suitable for this repo).
exclude: ^(target/|data/|logs/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        types_or: [rust, python, markdown, toml, yaml]
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci", "-sr", "-ln", "bash", "-w"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.40.0
    hooks:
      - id: typos
        args: ["--force-exclude"]
        types_or: [rust, python, toml, yaml, markdown]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      # Same approach as nautilus_trader: stable rustfmt with empty config so
      # nightly-only rustfmt.toml options do not break the check.
      - id: fmt
        name: cargo fmt
        description: Format files with cargo fmt
        entry: bash .pre-commit-hooks/cargo_fmt_stable.sh
        language: system
        args: ["--all", "--", "--check"]
        files: "\\.(rs|toml)$"
        types: [file]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Run Clippy on product crates
        entry: bash .pre-commit-hooks/cargo_clippy.sh
        language: system
        files: "\\.(rs|toml)$"
        types: [file]
        pass_filenames: false
