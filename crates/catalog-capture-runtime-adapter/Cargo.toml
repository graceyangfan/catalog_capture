[package]
name = "catalog-capture-runtime-adapter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["high-precision"]
# Example binaries are opt-in smoke/fixture helpers, not part of the default
# product build path.
example-binaries = []
high-precision = [
  "catalog-capture-core/high-precision",
  "nautilus-model/high-precision",
  "nautilus-persistence/high-precision",
]

[dependencies]
anyhow.workspace = true
catalog-capture-core = { path = "../catalog-capture-core" }
nautilus-common.workspace = true
nautilus-hyperliquid.workspace = true
nautilus-core.workspace = true
nautilus-model.workspace = true
nautilus-persistence.workspace = true
serde_json.workspace = true
tokio.workspace = true
ustr.workspace = true
log.workspace = true

[[example]]
name = "binance_futures_derivatives_state_capture"
path = "examples/binance_futures_derivatives_state_capture.rs"
required-features = ["example-binaries"]
test = false
doc = false

