[package]
name = "catalog-capture-runtime-adapter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["high-precision"]
high-precision = [
  "catalog-capture-core/high-precision",
  "nautilus-model/high-precision",
  "nautilus-persistence/high-precision",
]
[lib]
name = "catalog_capture_runtime_adapter"
# Library only — product binary is catalog-capture-cli.
crate-type = ["rlib"]

[dependencies]
anyhow.workspace = true
catalog-capture-core = { path = "../catalog-capture-core" }
nautilus-common.workspace = true
# Hyperliquid adapter used for HIP-4 universe helpers in this crate.
nautilus-hyperliquid = { workspace = true }
nautilus-core.workspace = true
nautilus-model.workspace = true
nautilus-persistence.workspace = true
serde_json.workspace = true
tokio.workspace = true
ustr.workspace = true
log.workspace = true

[dev-dependencies]
# Unit/integration tests only — no cargo [[example]] binaries.
rust_decimal.workspace = true
serde_json.workspace = true
tokio.workspace = true
