# Step 1 profile: Binance Futures perpetual built-in WS families (A1–A4).
# Captures quotes, mark prices, index prices, and funding rates for basis/carry research.

[runtime]
capture_seconds = 60
shutdown_timeout_secs = 10
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-BINANCE-PERP-WS"

[output]
catalog_uri = "file:///tmp/nautilus-catalog-capture-binance-perp-ws"
compression = "snappy"
layout_compatibility = "rust_canonical_with_python_legacy_mirror"
flush_rows = 1000
flush_interval_ms = 1000
max_buffer_bytes = 33554432
queue_capacity = 10000
overflow_policy = "drop_oldest"

[[venues]]
id = "binance_futures_main"
kind = "binance_futures"
environment = "testnet"
product_type = "usd_m"

[[capture.instruments]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.quotes]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.mark_prices]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.index_prices]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.funding_rates]]
instrument_id = "ETHUSDT-PERP.BINANCE"