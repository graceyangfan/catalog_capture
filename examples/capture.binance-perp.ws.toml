# Step 1–2 profile: Binance Futures perpetual built-in WS (A1–A6).
# Captures quotes, mark/index/funding, instrument metadata, and contract state subscriptions.
# Note: Binance instrument_status polling is ~3600s; short runs may only validate instruments.

[runtime]
capture_seconds = 60
shutdown_timeout_secs = 10
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-BINANCE-PERP-WS"

[output]
catalog_uri = "file://./data/binance-perp-ws"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 1000
flush_interval_ms = 1000
max_buffer_bytes = 33554432
queue_capacity = 10000
overflow_policy = "drop_oldest"

[[venues]]
id = "binance_futures_main"
kind = "binance_futures"
environment = "testnet"
product_type = "usd_m"

[[capture.instruments]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.quotes]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.mark_prices]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.index_prices]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.funding_rates]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.instrument_statuses]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.instrument_closes]]
instrument_id = "ETHUSDT-PERP.BINANCE"
