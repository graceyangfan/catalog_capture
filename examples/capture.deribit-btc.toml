# Step 3 profile: Deribit BTC perpetual hedge leg + near-term ATM options (A7).
# Instrument IDs must exist on Deribit mainnet; refresh strikes/expiry as chains roll.

[runtime]
capture_seconds = 60
shutdown_timeout_secs = 10
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-DERIBIT-BTC"

[output]
catalog_uri = "file:///tmp/catalog-capture-deribit-btc"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 1000
flush_interval_ms = 1000
max_buffer_bytes = 33554432
queue_capacity = 10000
overflow_policy = "drop_oldest"

[[venues]]
id = "deribit_main"
kind = "deribit"
environment = "mainnet"
product_types = ["future", "option"]

# Perpetual hedge leg
[[capture.instruments]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.quotes]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.mark_prices]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.index_prices]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.funding_rates]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

# Near-term ATM options (update when expiry rolls)
[[capture.instruments]]
instrument_id = "BTC-19JUN26-64500-C.DERIBIT"

[[capture.instruments]]
instrument_id = "BTC-19JUN26-64500-P.DERIBIT"

[[capture.quotes]]
instrument_id = "BTC-19JUN26-64500-C.DERIBIT"

[[capture.quotes]]
instrument_id = "BTC-19JUN26-64500-P.DERIBIT"

[[capture.option_greeks]]
instrument_id = "BTC-19JUN26-64500-C.DERIBIT"

[[capture.option_greeks]]
instrument_id = "BTC-19JUN26-64500-P.DERIBIT"
