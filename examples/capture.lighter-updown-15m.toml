# Continuous public 15m binary recording; no market IDs to edit.
# cargo run -p catalog-capture-cli --no-default-features --features venue-lighter-ext -- run --config examples/capture.lighter-updown-15m.toml
[runtime]
capture_seconds = 0
shutdown_timeout_secs = 20
delay_post_stop_secs = 2
node_name = "LIGHTER-UPDOWN-15M"

[output]
catalog_uri = "file://./data/lighter-updown-15m"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 5000
flush_interval_ms = 1000
queue_capacity = 50000
overflow_policy = "fail_fast"

[output.lifecycle]
mode = "segment"

[[venues]]
id = "LIGHTER"
kind = "lighter_binary"
environment = "mainnet"

# Each selector records instrument, TradeTick, full OrderBookDeltas,
# LighterOpenInterest, and 16-decimal-place IndexPriceUpdate oracle.
[[capture.lighter_updown]]
tag = "eth-updown-15m"
refresh_secs = 10
prefetch_secs = 30

[[capture.lighter_updown]]
tag = "btc-updown-15m"
refresh_secs = 10
prefetch_secs = 30
