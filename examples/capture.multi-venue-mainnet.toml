# Multi-venue mainnet capture (public market data only).
#
# Two independent clocks:
#   1) HIP-4 universe refresh — re-discover outcomes; unsubscribe old / subscribe new
#   2) Segment seal — close parquet files at 06:00 UTC (not the same as universe roll)
#
# Streams:
#   Hyperliquid: instruments, quotes, trades, mark_prices (rolling universe)
#   Binance USD-M: trades + L2 book_deltas depth=20 (@depth@0ms stream)
#   Deribit: BookSummary request ~1 rps
#
# Lightweight: flush often; LiveNode uses bounded cache (see runner).
#
#   cargo run -p catalog-capture-cli -- run --config examples/capture.multi-venue-mainnet.toml

[runtime]
capture_seconds = 0
shutdown_timeout_secs = 15
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-MULTI-VENUE-MAINNET"
# Optional: warn if capture-buffer estimate exceeds this many bytes
# resource_budget_bytes = 536870912

[runtime.hip4_universe_refresh]
enabled = true
idle_poll_secs = 1800
active_poll_secs = 10
pre_expiry_window_secs = 900
http_timeout_secs = 10
purge_removed_instruments = true

[runtime.metrics]
enabled = true
bind_addr = "127.0.0.1"
port = 9108
refresh_interval_secs = 5

[output]
catalog_uri = "file://./data/multi-venue-mainnet"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
# Keep buffers tight under book-delta load
flush_rows = 1000
flush_interval_ms = 1000
max_buffer_bytes = 16777216
max_total_buffer_bytes = 134217728
max_active_partitions = 64
queue_capacity = 20000
overflow_policy = "drop_oldest"

[output.lifecycle]
mode = "segment"

[output.lifecycle.segment]
row_group_rows = 2000

[output.lifecycle.durability]
sync_interval_ms = 1000

[output.lifecycle.seal]
enabled = true
schedule = "06:00"
timezone = "UTC"
interval_secs = 86400

[[venues]]
id = "hyperliquid_main"
kind = "hyperliquid"
environment = "mainnet"

[[venues]]
id = "binance_futures_main"
kind = "binance_futures"
environment = "live"
product_type = "usd_m"

[[venues]]
id = "deribit_main"
kind = "deribit"
environment = "mainnet"
product_types = ["option"]

[[capture.hip4_universe]]
venue_id = "hyperliquid_main"
underlying = "BTC"
period = "1d"
market_class = "priceBinary"
include_fallback = false
include_perp_mark = true
families = ["instruments", "quotes", "trades", "mark_prices"]

[[capture.instruments]]
instrument_id = "BTCUSDT-PERP.BINANCE"

[[capture.trades]]
instrument_id = "BTCUSDT-PERP.BINANCE"

[[capture.book_deltas]]
instrument_id = "BTCUSDT-PERP.BINANCE"
book_type = "L2_MBP"
depth = 20

[[capture.custom_data_requests]]
type_name = "DeribitBookSummary"
interval_secs = 1
fire_immediately = true
overlap_policy = "skip"
request_timeout_secs = 5

[capture.custom_data_requests.metadata]
currency = "BTC"
kind = "option"
