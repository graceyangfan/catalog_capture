# Predict BTC/ETH/BNB 5m and 15m + matching Binance Spot SBE L2/trades.
# Run from the repository root. No market IDs or credentials belong in this file.
# Required features: venue-predict,venue-binance. No Futures or HIP4 in this profile.
# Predict key: ignored env/predictfun.toml, or PREDICT_CREDENTIALS_FILE.
# Spot SBE credentials: ignored env/binance-spot-sbe.toml (api_key + private_key).

[runtime]
capture_seconds = 0
shutdown_timeout_secs = 15
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-PREDICT-CRYPTO-UPDOWN"

[output]
catalog_uri = "file://./data/predict-crypto-updown"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 1000
flush_interval_ms = 1000
max_buffer_bytes = 33554432
max_total_buffer_bytes = 134217728
queue_capacity = 10000
overflow_policy = "fail_fast"

[output.lifecycle]
mode = "segment"

[output.lifecycle.segment]
row_group_rows = 5000

[output.lifecycle.durability]
sync_interval_ms = 1000

# Each selector seals independently when its successor's first snapshot is accepted.
# The hourly timer seals only native Spot L2/trades, not Predict custom writers.
[output.lifecycle.seal]
enabled = true
schedule = "00:00"
timezone = "UTC"
interval_secs = 3600

[[venues]]
id = "predict_main"
kind = "predict"

[[venues]]
id = "binance_spot_sbe"
kind = "binance_spot"
environment = "live"

[[capture.custom_data]]
type_name = "PredictCryptoUpDown"
[capture.custom_data.metadata]
price_feed_symbol = "BTC/USDT"
title_asset = "Bitcoin"
interval_secs = "300"

[[capture.custom_data]]
type_name = "PredictCryptoUpDown"
[capture.custom_data.metadata]
price_feed_symbol = "BTC/USDT"
title_asset = "Bitcoin"
interval_secs = "900"

[[capture.custom_data]]
