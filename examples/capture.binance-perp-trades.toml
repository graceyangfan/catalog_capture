# Step 6a profile: Binance Futures perpetual built-in WS + trade ticks (A8).
# Extends Step 1–2 with `trades` on the same hedge leg.
# Verify with:
#   python3 tests/python_catalog_derivatives_probe.py <catalog_dir> ETHUSDT-PERP.BINANCE 1 --min-trade-rows 1
# Live smoke:
#   python3 tests/probe_binance_trades_smoke.py --seconds 180 --cleanup

[runtime]
capture_seconds = 60
shutdown_timeout_secs = 10
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-BINANCE-PERP-TRADES"

[output]
catalog_uri = "file:///tmp/nautilus-catalog-capture-binance-perp-trades"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 1000
flush_interval_ms = 1000
max_buffer_bytes = 33554432
queue_capacity = 10000
overflow_policy = "drop_oldest"

[[venues]]
id = "binance_futures_main"
kind = "binance_futures"
environment = "testnet"
product_type = "usd_m"

[[capture.instruments]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.quotes]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.trades]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.mark_prices]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.index_prices]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.funding_rates]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.instrument_statuses]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.instrument_closes]]
instrument_id = "ETHUSDT-PERP.BINANCE"
