[runtime]
capture_seconds = 120
shutdown_timeout_secs = 10
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-BYBIT-BTC-UNIVERSE-AUTOREFRESH"

[runtime.option_universe_refresh]
enabled = true
interval_secs = 15

[output]
catalog_uri = "file:///tmp/catalog-capture-bybit-btc-universe-autorefresh"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 1000
flush_interval_ms = 1000
max_buffer_bytes = 33554432
queue_capacity = 10000
overflow_policy = "drop_oldest"

[[venues]]
id = "bybit_main"
kind = "bybit"
environment = "mainnet"
product_types = ["linear", "option"]

[[capture.option_universe]]
venue_id = "bybit_main"
underlying = "BTC"
settlement_currency = "USDT"
include_perp = true
families = [
  "instruments",
  "quotes",
  "trades",
  "option_greeks",
  "forward_prices",
  "mark_prices",
  "index_prices",
  "funding_rates",
  "instrument_statuses",
  "instrument_closes",
]

[capture.option_universe.expiry_policy]
mode = "nearest"
days_max = 45

[capture.option_universe.strike_policy]
mode = "atm_relative"
strikes_above = 1
strikes_below = 1
