[runtime]
capture_seconds = 120
shutdown_timeout_secs = 10
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-DERIBIT-BTC-UNIVERSE-OI-RANKED-AUTOREFRESH"

[runtime.option_universe_refresh]
enabled = true
interval_secs = 15
strike_change_confirmations = 2

[output]
catalog_uri = "file:///tmp/nautilus-catalog-capture-deribit-btc-universe-oi-ranked-autorefresh"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 1000
flush_interval_ms = 1000
max_buffer_bytes = 33554432
queue_capacity = 10000
overflow_policy = "drop_oldest"

[[venues]]
id = "deribit_main"
kind = "deribit"
environment = "mainnet"
product_types = ["future", "option"]

[[capture.option_universe]]
venue_id = "deribit_main"
underlying = "BTC"
settlement_currency = "BTC"
include_perp = true
families = [
  "instruments",
  "quotes",
  "option_greeks",
  "forward_prices",
  "mark_prices",
  "index_prices",
  "funding_rates",
  "instrument_statuses",
  "instrument_closes",
]

[capture.option_universe.expiry_policy]
mode = "nearest"
days_max = 45

[capture.option_universe.strike_policy]
mode = "oi_ranked"
top_n = 3
