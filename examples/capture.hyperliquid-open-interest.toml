[runtime]
capture_seconds = 30
shutdown_timeout_secs = 10
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-HYPERLIQUID-OI"

[output]
catalog_uri = "file:///tmp/catalog-capture-hyperliquid-open-interest"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 5000
flush_interval_ms = 1000
max_buffer_bytes = 33554432
queue_capacity = 10000
overflow_policy = "drop_oldest"

[[venues]]
id = "hyperliquid_main"
kind = "hyperliquid"
environment = "testnet"

[[capture.instruments]]
instrument_id = "ETH-USD-PERP.HYPERLIQUID"

[[capture.quotes]]
instrument_id = "ETH-USD-PERP.HYPERLIQUID"

[[capture.custom_data]]
type_name = "HyperliquidOpenInterest"
identifier = "ETH-USD-PERP.HYPERLIQUID"

[capture.custom_data.metadata]
instrument_id = "ETH-USD-PERP.HYPERLIQUID"
