# Production-shaped Bybit BTC option-universe capture (daemon mode).

[runtime]
capture_seconds = 0
shutdown_timeout_secs = 30
delay_post_stop_secs = 5
node_name = "CATALOG-CAPTURE-BYBIT-BTC-UNIVERSE-UNATTENDED"

[runtime.option_universe_refresh]
enabled = true
interval_secs = 300

[output]
catalog_uri = "file:///var/lib/nautilus-catalog-capture/bybit-btc-universe"
compression = "snappy"
layout_compatibility = "rust_canonical_with_python_legacy_mirror"
flush_rows = 5000
flush_interval_ms = 5000
max_buffer_bytes = 67108864
queue_capacity = 20000
overflow_policy = "drop_oldest"

[[venues]]
id = "bybit_main"
kind = "bybit"
environment = "mainnet"
product_types = ["linear", "option"]

[[capture.option_universe]]
venue_id = "bybit_main"
underlying = "BTC"
settlement_currency = "USDT"
include_perp = true
families = [
  "instruments",
  "quotes",
  "trades",
  "option_greeks",
  "forward_prices",
  "mark_prices",
  "index_prices",
  "funding_rates",
  "instrument_statuses",
  "instrument_closes",
]

[capture.option_universe.expiry_policy]
mode = "nearest"
days_max = 45

[capture.option_universe.strike_policy]
mode = "atm_relative"
strikes_above = 1
strikes_below = 1
