# Production-shaped OKX BTC option-universe capture (daemon mode).

[runtime]
capture_seconds = 0
shutdown_timeout_secs = 30
delay_post_stop_secs = 5
node_name = "CATALOG-CAPTURE-OKX-BTC-UNIVERSE-UNATTENDED"

[runtime.option_universe_refresh]
enabled = true
interval_secs = 300

[output]
catalog_uri = "file:///var/lib/catalog-capture/okx-btc-universe"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 5000
flush_interval_ms = 5000
max_buffer_bytes = 67108864
queue_capacity = 20000
overflow_policy = "drop_oldest"

[[venues]]
id = "okx_main"
kind = "okx"
environment = "live"
instrument_types = ["swap", "option"]
instrument_families = ["BTC-USD"]

[[capture.option_universe]]
venue_id = "okx_main"
underlying = "BTC"
settlement_currency = "USD"
include_perp = true
families = [
  "instruments",
  "quotes",
  "trades",
  "option_greeks",
  "forward_prices",
  "mark_prices",
  "index_prices",
  "funding_rates",
  "instrument_statuses",
  "instrument_closes",
]

[capture.option_universe.expiry_policy]
mode = "nearest"
days_max = 45

[capture.option_universe.strike_policy]
mode = "atm_relative"
strikes_above = 1
strikes_below = 1
