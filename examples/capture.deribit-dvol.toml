[runtime]
capture_seconds = 30
shutdown_timeout_secs = 10
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-DERIBIT-DVOL"

[output]
catalog_uri = "file://./data/deribit-dvol"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 5000
flush_interval_ms = 1000
max_buffer_bytes = 33554432
queue_capacity = 10000
overflow_policy = "drop_oldest"

[[venues]]
id = "deribit_main"
kind = "deribit"
environment = "live"
product_types = ["future", "option"]

[[capture.instruments]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.quotes]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.mark_prices]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.index_prices]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.funding_rates]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.custom_data]]
type_name = "DeribitVolatilityIndex"

[capture.custom_data.metadata]
index_name = "btc_usd"
