# Rolling Predict BTC 5m native YES depth and trades. No custom snapshot files.
# Discovery publishes both BinaryOption definitions and confirms rollover by snapshot.
#
# Keep the API key outside this capture TOML:
#   cp examples/predictfun.credentials.toml.example env/predictfun.toml
#   chmod 600 env/predictfun.toml
#
# Build/run:
#   cargo run -p catalog-capture-cli --no-default-features --features venue-predict -- \
#     run --config examples/capture.predict-native.toml

[runtime]
capture_seconds = 0
shutdown_timeout_secs = 30
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-PREDICT"

[output]
catalog_uri = "file://./data/predict-native"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 1000
flush_interval_ms = 2000
max_buffer_bytes = 8388608
# Aggregate partition buffers per family; independent of ingress overrides below.
max_total_buffer_bytes = 67108864
max_active_partitions = 64
# Ingress fallback for families without an explicit override.
queue_capacity = 32768
queue_max_bytes = 67108864
# Reject and report a full-queue item; later data continues recording.
overflow_policy = "fail_fast"

# Provisional ingress budgets; tune from per-family peaks and queue age on the server.
# Changing these limits does not change flush or Parquet row-group thresholds.
[output.queues.book_depth]
capacity = 8192
max_bytes = 33554432

[output.queues.trades]
capacity = 32768
max_bytes = 33554432

[output.queues.instruments]
capacity = 1024
max_bytes = 4194304

[output.lifecycle]
mode = "segment"

[output.lifecycle.durability]
# Fsyncs emitted bytes; a readable Parquet commit still requires close/seal.
# Ten seconds reduces periodic sync calls; it does not bound crash data loss.
sync_interval_ms = 10000

[[venues]]
id = "predict_main"
kind = "predict"

[[capture.custom_data]]
type_name = "PredictCryptoUpDown"

[capture.custom_data.metadata]
# Exact official variantData.priceFeedSymbol; change only after observing it
# in the official market response for the desired product.
price_feed_symbol = "BTCUSDT"
title_asset = "Bitcoin"
interval_secs = "300"

# Native subscriptions follow the same snapshot-confirmed rolling YES instrument.
record_snapshot = "false"
record_depth = "true"
record_trades = "true"
