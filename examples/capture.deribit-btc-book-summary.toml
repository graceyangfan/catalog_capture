# Deribit BookSummary (request path, mainnet public API).
# One HTTP call per currency via get_book_summary_by_currency.
# interval_secs=1 ≈ 1 rps; Deribit non-matching public budget is ~20 rps.
# overlap_policy=skip avoids stacking if a call is still in flight.
#
# Default lifecycle is segment (*.parquet.part + seal 06:00 UTC). For a pure
# short smoke that writes immediate catalog parquets, set mode = "chunked"
# (emits a WARNING — not for production).

[runtime]
capture_seconds = 0
shutdown_timeout_secs = 15
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-DERIBIT-BOOK-SUMMARY"

[output]
catalog_uri = "file://./data/deribit-book-summary"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 5000
flush_interval_ms = 1000
max_buffer_bytes = 67108864
queue_capacity = 50000
overflow_policy = "drop_oldest"

# Defaults: mode = segment, seal enabled @ 06:00 UTC. Uncomment for smoke-only chunked:
# [output.lifecycle]
# mode = "chunked"

[[venues]]
id = "deribit_main"
kind = "deribit"
environment = "mainnet"
product_types = ["option"]

[[capture.custom_data_requests]]
type_name = "DeribitBookSummary"
interval_secs = 1
fire_immediately = true
overlap_policy = "skip"
request_timeout_secs = 5

[capture.custom_data_requests.metadata]
currency = "BTC"
kind = "option"
