# Predict BTC/ETH 15m YES depth + trades and both outcome definitions.
# Lighter BTC/ETH 15m Up-priced full L2 deltas + trades, OI and oracle.
# Binance BTC/ETH Spot SBE L2 deltas + trades.
# Required features: venue-predict,venue-lighter-ext,venue-binance.
# Credentials: env/predictfun.toml and env/binance-spot-sbe.toml (Ed25519).
# Lighter public mainnet recording requires no credentials.
[runtime]
capture_seconds = 0
shutdown_timeout_secs = 20
delay_post_stop_secs = 2
node_name = "CAPTURE-PREDICT-LIGHTER-BINANCE-BTC-ETH-15M"

[output]
catalog_uri = "file://./data/predict-lighter-binance-btc-eth-15m"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 1000
flush_interval_ms = 1000
max_buffer_bytes = 8388608
max_total_buffer_bytes = 67108864
queue_capacity = 10000
overflow_policy = "fail_fast"

[output.lifecycle]
mode = "segment"

# Continuous reference streams seal hourly. Rolling outcomes seal on handover.
[output.lifecycle.seal]
enabled = true
schedule = "00:00"
timezone = "UTC"
interval_secs = 3600

[[venues]]
id = "LIGHTER"
kind = "lighter_binary"
environment = "mainnet"

# Automatic discovery and expiry rotation; no fixed market IDs required.
# One public Up-priced book represents both outcomes; no separate YES/NO streams.
# Each selector records Instrument, TradeTick, full OrderBookDeltas, OI and oracle.
[[capture.lighter_updown]]
tag = "btc-updown-15m"

[[capture.lighter_updown]]
tag = "eth-updown-15m"

[[venues]]
id = "predict_main"
kind = "predict"

# Discovery records both definitions. Native depth/trades follow the current YES.

[[capture.custom_data]]
type_name = "PredictCryptoUpDown"
[capture.custom_data.metadata]
price_feed_symbol = "BTCUSDT"
title_asset = "Bitcoin"
interval_secs = "900"
record_snapshot = "false"
record_depth = "true"
record_trades = "true"

[[capture.custom_data]]
type_name = "PredictCryptoUpDown"
[capture.custom_data.metadata]
price_feed_symbol = "ETHUSDT"
title_asset = "Ethereum"
interval_secs = "900"
record_snapshot = "false"
record_depth = "true"
record_trades = "true"

[[venues]]
id = "binance_spot_sbe"
kind = "binance_spot"
environment = "live"

# Omit depth for full SBE diff-depth with the adapter's snapshot/sequence handoff.

[[capture.instruments]]
instrument_id = "BTCUSDT.BINANCE"

[[capture.book_deltas]]
instrument_id = "BTCUSDT.BINANCE"
book_type = "L2_MBP"

[[capture.trades]]
instrument_id = "BTCUSDT.BINANCE"

[[capture.instruments]]
instrument_id = "ETHUSDT.BINANCE"

[[capture.book_deltas]]
instrument_id = "ETHUSDT.BINANCE"
book_type = "L2_MBP"

[[capture.trades]]
instrument_id = "ETHUSDT.BINANCE"
