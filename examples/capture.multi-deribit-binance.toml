# Step 4 profile: dual-venue capture (Binance mainnet perp + Deribit mainnet perp).

[runtime]
capture_seconds = 60
shutdown_timeout_secs = 10
delay_post_stop_secs = 2
node_name = "CATALOG-CAPTURE-MULTI-DERIBIT-BINANCE"

[output]
catalog_uri = "file://./data/multi-deribit-binance"
compression = "snappy"
layout_compatibility = "rust_canonical_only"
flush_rows = 1000
flush_interval_ms = 1000
max_buffer_bytes = 33554432
queue_capacity = 10000
overflow_policy = "drop_oldest"

[[venues]]
id = "binance_futures_main"
kind = "binance_futures"
environment = "live"
product_type = "usd_m"

[[venues]]
id = "deribit_main"
kind = "deribit"
environment = "live"
product_types = ["future"]

[[capture.instruments]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.quotes]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.mark_prices]]
instrument_id = "ETHUSDT-PERP.BINANCE"

[[capture.instruments]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.quotes]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.mark_prices]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.index_prices]]
instrument_id = "BTC-PERPETUAL.DERIBIT"

[[capture.funding_rates]]
instrument_id = "BTC-PERPETUAL.DERIBIT"
